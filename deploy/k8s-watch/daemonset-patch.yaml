apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xdpbridge
  namespace: xdpbridge-system
spec:
  template:
    spec:
      # Pod-level setting overrides the ServiceAccount's "false".
      automountServiceAccountToken: true
      containers:
        - name: daemon
          env:
            - name: XDPBRIDGE_K8S_WATCH
              value: "true"
